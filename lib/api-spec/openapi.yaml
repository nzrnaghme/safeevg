openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quote-requests
    description: Public quote request submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quote-requests:
    post:
      operationId: createQuoteRequest
      tags: [quote-requests]
      summary: Submit a project quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "201":
          description: Quote request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestReceipt"
        "400":
          description: Invalid quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteRequestInput:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - fullName
        - email
    QuoteRequestReceipt:
      type: object
      properties:
        id:
          type: integer
        receivedAt:
          type: string
          format: date-time
      required:
        - id
        - receivedAt
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

