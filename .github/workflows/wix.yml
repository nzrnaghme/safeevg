name: Wix website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --build
      - run: pnpm --filter @workspace/safe-public-works typecheck
      - run: node scripts/build-wix.mjs
      - run: node scripts/check-wix-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wix-site
          path: |
            artifacts/safe-public-works/dist
            wix.config.json
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wix-production
      cancel-in-progress: false
    environment:
      name: wix-production
      url: https://safeevg-code-hoomansse-0c09.wix-site-host.com
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: wix-site
      - name: Install Wix CLI
        run: npm install --global @wix/cli@1.2.13
      - name: Authenticate Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo '::error::Add the WIX_API_KEY repository secret before publishing.'
            exit 1
          fi
          wix login --api-key "$WIX_API_KEY"
      - name: Publish built website
        run: wix release --comment "GitHub main $GITHUB_SHA"
      - name: Check published pages
        run: |
          for route in / /contact /equipment /privacy; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 "https://safeevg-code-hoomansse-0c09.wix-site-host.com${route}" -o /dev/null
          done
